<!DOCTYPE html>
<html lang="zh">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    DRTE AI Herbs
  </title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="css/report.css"
  />

</head>

<body>

  <div class="upload-page">

    <!-- Logo -->

    <div class="upload-logo">
      🌿
    </div>

    <!-- Title -->

    <h1 class="upload-title">
      DRTE AI Herbs
    </h1>

    <p class="upload-subtitle">
      AI Traditional Medicine Verification System
    </p>

    <!-- Upload Card -->

    <div class="upload-card">

      <!-- Upload Area -->

      <label
        for="imageInput"
        class="upload-dropzone"
      >

        <div class="upload-icon">
          📸
        </div>

        <div class="upload-text">
          上传药材图片
        </div>

        <div class="upload-hint">
          支持 JPG / PNG
        </div>

      </label>

      <!-- Hidden Input -->

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      />

      <!-- Analyze Button -->

      <button id="analyzeBtn">
        开始AI验药
      </button>

    </div>

    <!-- Loading -->

    <div
      id="loading"
      style="display:none;"
    >

      AI正在分析药材图片...

    </div>

    <!-- Result -->

    <div id="result"></div>

  </div>

  <script
    type="module"
    src="js/app.js"
  ></script>

</body>

</html>
